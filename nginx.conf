# Servidor do bundle web (dist/). Substitui /etc/nginx/conf.d/default.conf da
# imagem nginx-unprivileged (porta 8080, sem root).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Arquivos com hash no nome (gerados pelo Vite): nunca mudam.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Imagens WebP: so mudam ao rodar scripts/optimize-images.mjs.
  location /img/ {
    expires 30d;
    try_files $uri =404;
  }

  # HashRouter: toda a navegacao fica no #; o index.html nunca fica em cache
  # para que um novo deploy chegue na proxima abertura.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
